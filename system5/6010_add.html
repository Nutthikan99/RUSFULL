EQTYPE-21"/></div><div class="field"><label>ชื่อประเภทคำร้อง *</label><input placeholder="เช่น ขอสอบนอกเวลา"/></div><div class="field"><label>หมวดคำร้อง *</label><select><option>การลงทะเบียน</option><option>ผลการศึกษา</option><option>สถานภาพ</option></select></div><div class="field"><label>ระบบงานที่รับผลไปดำเนินการ</label><select><option>ระบบลงทะเบียน</option><option>ระบบประมวลผลการศึกษา</option><option>ระบบเอกสารและงานบริการ</option><option>ระบบการเงินและค่าธรรมเนียม</option><option>ระบบเทียบโอนผลการศึกษา</option><option>หน่วยงานผู้รับผิดชอบตามประเภทคำร้อง</option></select></div></div><h3>เงื่อนไข</h3><label class="check"><input checked="" type="checkbox"/> ตรวจสถานภาพนักศึกษาอัตโนมัติ</label><label class="check"><input type="checkbox"/> มีค่าธรรมเนียม (เชื่อมการชำระผ่านระบบการเงินและค่าธรรมเนียม)</label><label class="check"><input checked="" type="checkbox"/> ต้องแนบเอกสารประกอบ</label><h3>สายอนุมัติ</h3><div class="flow"><span>อาจารย์ที่ปรึกษา</span>→<span>เจ้าหน้าที่ทะเบียน</span><button class="btn btn-s" onclick="toast('เพิ่มลำดับผู้อนุมัติ')">+ เพิ่มลำดับ</button></div><div class="actions"><a class="btn btn-s" href="6010.html">ยกเลิก</a><button class="btn btn-p" onclick="location.href='6011.html'">บันทึกและส่งอนุมัติ</button></div></div></div></main><script>window.ACTIVE_LEAF='ประเภทคำร้องและเงื่อนไข';</script><script src="../shared/rus-nav.js"></script><script>function adv(){document.querySelector('.advanced')?.classList.toggle('open')}function toast(m){let x=document.createElement('div');x.textContent=m;x.style='position:fixed;right:22px;bottom:22px;background:#173b6d;color:#fff;padding:11px 16px;border-radius:9px;z-index:99';document.body.appendChild(x);setTimeout(()=>x.remove(),1700)}function resetFilters(){document.querySelectorAll('.filter input,.filter select,.advanced input,.advanced select').forEach(e=>e.value='')}</script></div></body></html>
