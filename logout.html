<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ออกจากระบบ — ระบบทะเบียนและประมวลผล มทร.สุวรรณภูมิ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Saira+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rus-primary:#2952A3; --rus-primary-dark:#1E3D7A; --rus-primary-deep:#16305F;
  --rus-primary-light:#E8EEF7; --rus-primary-50:#F3F6FB;
  --rus-accent:#E8A33D; --rus-accent-dark:#C9871F;
  --ok:#2E7D32; --error:#C62828;
  --bg:#EEF1F6; --surface:#FFFFFF; --border:#D8DCE3; --border-strong:#C2C8D2;
  --text:#1A1F2B; --text-muted:#5A6273; --text-faint:#8A92A3;
  --radius:10px; --shadow:0 2px 8px rgba(20,40,80,.08); --shadow-lg:0 8px 28px rgba(20,40,80,.16);
  --font:"Kanit","Sarabun",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--text);background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);max-width:440px;width:100%;padding:44px 40px;text-align:center}
.logo{width:88px;height:auto;margin:0 auto 22px;display:block}
.icon-circle{width:72px;height:72px;border-radius:50%;background:var(--rus-primary-50);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.icon-circle svg{width:34px;height:34px;color:var(--rus-primary)}
h1{font-size:23px;font-weight:600;margin-bottom:10px}
p{font-size:15px;color:var(--text-muted);line-height:1.65;margin-bottom:28px}
.btns{display:flex;flex-direction:column;gap:11px}
.btn{width:100%;padding:13px;border:none;border-radius:9px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none}
.btn svg{width:19px;height:19px}
.btn-primary{background:var(--rus-primary);color:#fff;box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--rus-primary-dark)}
.btn-primary:active{transform:translateY(1px)}
.btn-ghost{background:#fff;color:var(--text-muted);border:1.5px solid var(--border-strong)}
.btn-ghost:hover{background:var(--rus-primary-50);color:var(--rus-primary);border-color:var(--rus-primary)}
.foot{margin-top:26px;font-size:12.5px;color:var(--text-faint);line-height:1.6}
/* state หลังออกจากระบบ */
.done{display:none}
.done.show{display:block;animation:fade .3s}
.live.hide{display:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--rus-primary);border-radius:50%;animation:rot .9s linear infinite;margin:0 auto 16px}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
<link rel="stylesheet" href="shared/rus-ui-normalize.css">
</head>
<body>
  <div class="card">
    <img src="shared/assets/logo.gif" alt="ตราสัญลักษณ์ มทร.สุวรรณภูมิ" class="logo" onerror="this.style.display='none'">

    <!-- มุมมองก่อนยืนยัน -->
    <div class="live" id="live">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      </div>
      <h1>ออกจากระบบ</h1>
      <p>ท่านต้องการออกจากระบบทะเบียนและประมวลผลใช่หรือไม่?<br>ระบบจะสิ้นสุดการใช้งานของท่านอย่างปลอดภัย</p>
      <div class="btns">
        <button class="btn btn-primary" id="btnLogout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
          ยืนยันออกจากระบบ
        </button>
        <a class="btn btn-ghost" href="main.html">ยกเลิก / กลับสู่หน้าหลัก</a>
      </div>
    </div>

    <!-- มุมมองหลังออกจากระบบ -->
    <div class="done" id="done">
      <div class="spin" id="spin"></div>
      <div class="icon-circle" id="okIcon" style="display:none;background:#E7F3E8">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <h1 id="doneTitle">กำลังออกจากระบบ...</h1>
      <p id="doneText">โปรดรอสักครู่ ระบบกำลังสิ้นสุดการใช้งานของท่าน</p>
      <div class="btns" id="doneBtns" style="display:none">
        <a class="btn btn-primary" href="login.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>
          กลับสู่หน้าเข้าสู่ระบบ
        </a>
      </div>
    </div>

    <div class="foot">© 2569 มหาวิทยาลัยเทคโนโลยีราชมงคลสุวรรณภูมิ<br>ระบบทะเบียนและประมวลผล</div>
  </div>

<script>
(function(){
  document.getElementById('btnLogout').addEventListener('click',function(){
    document.getElementById('live').classList.add('hide');
    document.getElementById('done').classList.add('show');
    // จำลองการ logout
    setTimeout(function(){
      document.getElementById('spin').style.display='none';
      document.getElementById('okIcon').style.display='flex';
      document.getElementById('doneTitle').textContent='ออกจากระบบสำเร็จ';
      document.getElementById('doneText').textContent='ท่านได้ออกจากระบบเรียบร้อยแล้ว ขอบคุณที่ใช้บริการ';
      document.getElementById('doneBtns').style.display='flex';
    },1400);
    // เด้งไปหน้า login อัตโนมัติ
    setTimeout(function(){window.location.href='login.html';},3000);
  });
})();
</script>
</body>
</html>
