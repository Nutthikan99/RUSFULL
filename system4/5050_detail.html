<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รายละเอียดเอกสารการเงิน — SYSTEM 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/rus-ui.css"><link rel="stylesheet" href="../shared/rus-ui-normalize.css"><link rel="stylesheet" href="../shared/rus-sidebar-shared.css"><link rel="stylesheet" href="../shared/system4-v144.css"><style>.receipt-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.receipt-summary>div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:13px}@media(max-width:900px){.receipt-summary{grid-template-columns:1fr 1fr}}</style></head><body><div class="app"><header class="topbar"><button aria-label="ย่อ/ขยายเมนู" class="menu-toggle" id="menuToggle"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="brand"><div class="mark">RUS</div><div class="titles"><div class="th">ระบบการเงินและค่าธรรมเนียม</div><div class="en">Student Finance System · มทร.สุวรรณภูมิ</div></div></div><div class="spacer"></div><div class="util"><button class="user-chip"><div class="who"><div class="n">เจ้าหน้าที่การเงิน</div><div class="r">Finance Staff · SYSTEM 4</div></div><div class="avatar">กง</div></button><a class="logout-btn" href="../logout.html"><span>ออกจากระบบ</span></a></div></header><aside class="sidebar" id="sidebar"><div class="nav-section"><div class="label">ภาพรวม</div><a class="nav-parent" href="../main.html"><span class="ico">▦</span><span class="txt">แดชบอร์ด</span></a></div><div class="nav-section"><div class="label">ระบบงาน (9 ระบบ)</div><div id="navSystems"></div></div></aside><div class="backdrop" id="backdrop"></div><main class="content"><div class="s4-page"><div class="breadcrumb">หน้าแรก &gt; STEP 5 &gt; ใบเสร็จและเอกสารการเงิน &gt; รายละเอียด</div><div class="pagehead"><div><h1 id="title">รายละเอียดเอกสารการเงิน</h1><div class="sub">เอกสารต้องอ้างอิง Payment ที่ผ่านการกระทบยอดแล้ว ไม่ใช้ยอด Invoice ทั้งก้อนหากเป็นการชำระบางส่วน</div></div><button class="btn btn-s" onclick="location.href='5050.html'">กลับรายการ</button></div><div id="body"></div></div></main></div><script>window.ACTIVE_LEAF='ใบเสร็จและเอกสารการเงิน';</script><script src="../shared/rus-nav.js"></script><script src="../shared/system4-partial-payment-demo.js"></script><script>
const pms=new URLSearchParams(location.search),rid=pms.get('id'),pid=pms.get('payment'),isSample=pms.get('sample')==='1',m=S4PartialDemo.money;let r=rid?(isSample?S4PartialDemo.sampleReceipt(rid):S4PartialDemo.findReceipt(rid)):null,p=pid?(isSample?S4PartialDemo.samplePayment(pid):S4PartialDemo.findPayment(pid)):(r?(isSample?S4PartialDemo.samplePayment(r.paymentId):S4PartialDemo.findPayment(r.paymentId)):null),s=S4PartialDemo.load();
function draw(){if(!p){body.innerHTML='<div class="dangerbox">ไม่พบ Payment/เอกสารที่ระบุ</div>';return}r=r||S4PartialDemo.receiptForPayment(p.id,'receipt');const remain=S4PartialDemo.outstanding(s);body.innerHTML=`<div class="panel"><h3>Payment ที่เป็นต้นทางของเอกสาร</h3><div class="receipt-summary"><div><div class="muted">Invoice</div><b>${p.invoiceId||s.invoiceId}</b></div><div><div class="muted">Payment</div><b>${p.id}</b></div><div><div class="muted">ยอดรับจริง</div><b class="money">${m(p.amount)} บาท</b></div><div><div class="muted">สถานะกระทบยอด</div><span class="status ${p.reconciled?'ok':'warn'}">${p.reconciled?'ผ่านแล้ว':'ยังไม่ผ่าน'}</span></div></div><div class="note" style="margin-top:12px"><b>ตัวอย่าง:</b> กรณี Invoice 12,000 บาท จ่ายครั้งแรก 4,000 บาท เอกสารฉบับแรกต้องออกยอด <b>4,000 บาท</b> ไม่ใช่ 12,000 บาท ส่วนยอดที่จ่ายครั้งถัดไปจะมีเอกสารอีกฉบับตาม Payment นั้น</div></div>${r?issued():ready()}`}
function ready(){return `<div class="panel"><h3>ออกเอกสารการเงิน</h3><div class="kv"><b>ผู้ชำระ</b><span>${p.payerId||s.payerId} · ${p.payerName||s.payerName}</span><b>ยอดที่จะออกเอกสาร</b><span class="money">${m(p.amount)} บาท</span><b>ช่องทาง</b><span>${p.channel}</span><b>สถานะตัวอย่าง</b><span>${isSample?'ผ่านการกระทบยอดแล้ว':'ยอดคงเหลือ '+m(S4PartialDemo.outstanding(s))+' บาท'}</span></div><div class="footeractions"><button class="btn btn-p" onclick="issue('receipt')">ออก e-Receipt ${m(p.amount)} บาท</button><button class="btn btn-s" onclick="issue('tax')">ออกใบกำกับภาษี</button></div></div>`}
function issued(){return `<div class="panel"><h3>เอกสารที่ออกแล้ว</h3><div class="kv"><b>เลขเอกสาร</b><span>${r.id}</span><b>Verification Code</b><span>${r.verification}</span><b>ยอดในเอกสาร</b><span class="money">${m(r.amount)} บาท</span><b>สถานะ</b><span class="status ${r.status==='active'?'ok':'bad'}">${r.status==='active'?'ใช้งานได้':'ยกเลิก'}</span></div><div class="footeractions"><button class="btn btn-p" onclick="location.href='5050_receipt.html?id=${r.id}${isSample?'&sample=1':''}'">ดู / พิมพ์เอกสาร</button><button class="btn btn-s" onclick="location.href='5051.html?code=${encodeURIComponent(r.verification)}${isSample?'&sample=1':''}'">ตรวจสอบความถูกต้อง</button></div></div>`}
function issue(t){if(isSample){alert('รายการตัวอย่างนี้ผ่านการออกเอกสารแล้วหรือใช้เพื่อสาธิตเท่านั้น');return}try{const x=S4PartialDemo.issueReceipt(p.id,t);if(t==='tax'){location.href='5050_receipt.html?id='+encodeURIComponent(x.id)}else{r=x;draw()}}catch(e){alert(e.message)}}draw();
</script></body></html>
