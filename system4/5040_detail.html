function closeInvoice(){if(!ok.checked){alert('กรุณายืนยันผลการตรวจสอบ');return}const r=S4PartialDemo.reconcile(id),remaining=S4PartialDemo.outstanding(r.state);done.style.display='block';done.innerHTML='<b>ปิดยอดสำเร็จ</b><br>ชำระสะสม '+m(r.state.confirmedPaid)+' บาท · ยอดคงเหลือ '+m(remaining)+' บาท · สถานะ Invoice = ชำระครบแล้ว<br><button class="btn btn-p" style="margin-top:10px" onclick="location.href=\'5030_detail.html?id=INV-6900812\'">กลับดู Invoice</button> <button class="btn btn-s" style="margin-top:10px" onclick="location.href=\'5050.html\'">ไป STEP 5 ออกใบเสร็จ</button>'}
