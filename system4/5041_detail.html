<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ยืนยันการชำระบางส่วน — SYSTEM 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/rus-ui.css"><link rel="stylesheet" href="../shared/rus-ui-normalize.css"><link rel="stylesheet" href="../shared/rus-sidebar-shared.css"><link rel="stylesheet" href="../shared/system4-v144.css"></head><body><div class="app"><header class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="brand"><div class="mark">RUS</div><div class="titles"><div class="th">ระบบการเงินและค่าธรรมเนียม</div><div class="en">Student Finance System · มทร.สุวรรณภูมิ</div></div></div><div class="spacer"></div><div class="util"><a class="logout-btn" href="../logout.html">ออกจากระบบ</a></div></header><aside class="sidebar" id="sidebar"><div class="nav-section"><div class="label">ระบบงาน (9 ระบบ)</div><div id="navSystems"></div></div></aside><div class="backdrop" id="backdrop"></div><main class="content"><div class="s4-page"><div class="breadcrumb">หน้าแรก &gt; STEP 4 &gt; ตรวจสอบ Partial Payment</div><div class="pagehead"><div><h1>ยืนยันการชำระบางส่วน</h1><div class="sub">STEP 4 ไม่รับเงินใหม่ แต่ยืนยัน Transaction ที่รับมาจาก STEP 3</div></div><button class="btn btn-s" onclick="location.href='5041.html'">กลับรายการ</button></div><div id="content"></div></div></main></div><script>window.ACTIVE_LEAF='ตรวจสอบรายการผิดปกติ';</script><script src="../shared/rus-nav.js"></script><script src="../shared/system4-partial-payment-demo.js"></script><script>
const id=new URLSearchParams(location.search).get('id'),s=S4PartialDemo.load(),p=S4PartialDemo.findPayment(id),m=S4PartialDemo.money,remBefore=S4PartialDemo.outstanding(s);if(!p){content.innerHTML='<div class="dangerbox">ไม่พบ Payment</div>'}else{content.innerHTML=`<div class="dangerbox"><b>Transaction นี้เป็นการชำระบางส่วน</b><br>ยอดคงเหลือก่อนรับ ${m(remBefore)} บาท · STEP 3 รับเงินจริง ${m(p.amount)} บาท · หลังยืนยันจะเหลือ ${m(remBefore-p.amount)} บาท</div><div class="split2"><div class="panel"><h3>Invoice</h3><div class="kv"><b>Invoice</b><span>INV-6900812</span><b>ยอดคงเหลือก่อนรับ</b><span class="money">${m(remBefore)} บาท</span><b>ผู้ชำระ</b><span>66012345 · กิตติพงษ์</span></div></div><div class="panel"><h3>Transaction จาก STEP 3</h3><div class="kv"><b>Payment ID</b><span>${p.id}</span><b>Transaction</b><span>${p.txn}</span><b>ยอดรับจริง</b><span class="money">${m(p.amount)} บาท</span><b>ช่องทาง</b><span>${p.channel}</span></div></div></div><div class="panel"><h3>ยืนยันผล</h3><label style="display:flex;gap:10px"><input id="ok" type="checkbox"> ยืนยันว่า Transaction จำนวน <b>${m(p.amount)} บาท</b> เป็นของ Invoice นี้และให้บันทึกเป็นการชำระบางส่วน</label><div class="field" style="margin-top:12px"><label>หมายเหตุ</label><textarea id="note" placeholder="เช่น รับชำระงวดแรกตามที่ผู้ชำระดำเนินการ"></textarea></div><div class="footeractions"><button class="btn btn-p" onclick="confirmPartial()">ยืนยันการชำระบางส่วน ${m(p.amount)} บาท</button></div><div id="done" class="paid-banner" style="display:none"></div></div>`}
function confirmPartial(){if(!ok.checked){alert('กรุณายืนยันผลการตรวจสอบ');return}const r=S4PartialDemo.reconcile(id),remain=S4PartialDemo.outstanding(r.state);done.style.display='block';done.innerHTML='<b>บันทึกสำเร็จ</b><br>ชำระสะสม '+m(r.state.confirmedPaid)+' บาท · คงเหลือ '+m(remain)+' บาท<br><button class="btn btn-p" style="margin-top:10px" onclick="location.href=\'5030_detail.html?id=INV-6900812\'">กลับ STEP 3 เพื่อชำระยอดคงเหลือ '+m(remain)+' บาท</button>'}
</script></body></html>
