<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจสอบเอกสารการเงิน — SYSTEM 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/rus-ui.css"><link rel="stylesheet" href="../shared/rus-ui-normalize.css"><link rel="stylesheet" href="../shared/rus-sidebar-shared.css"><link rel="stylesheet" href="../shared/system4-v144.css"><style>.verifybar{display:grid;grid-template-columns:minmax(300px,1fr) auto;gap:10px;align-items:end;max-width:760px}.verify-result{margin-top:18px}</style></head><body><div class="app"><header class="topbar"><button aria-label="ย่อ/ขยายเมนู" class="menu-toggle" id="menuToggle"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="brand"><div class="mark">RUS</div><div class="titles"><div class="th">ระบบการเงินและค่าธรรมเนียม</div><div class="en">Student Finance System · มทร.สุวรรณภูมิ</div></div></div><div class="spacer"></div><div class="util"><button class="user-chip"><div class="who"><div class="n">เจ้าหน้าที่การเงิน</div><div class="r">Finance Staff · SYSTEM 4</div></div><div class="avatar">กง</div></button><a class="logout-btn" href="../logout.html"><span>ออกจากระบบ</span></a></div></header><aside class="sidebar" id="sidebar"><div class="nav-section"><div class="label">ภาพรวม</div><a class="nav-parent" href="../main.html"><span class="ico">▦</span><span class="txt">แดชบอร์ด</span></a></div><div class="nav-section"><div class="label">ระบบงาน (9 ระบบ)</div><div id="navSystems"></div></div></aside><div class="backdrop" id="backdrop"></div><main class="content"><div class="s4-page"><div class="breadcrumb">หน้าแรก &gt; STEP 5 &gt; ตรวจสอบเอกสารการเงิน</div><div class="pagehead"><div><h1>ตรวจสอบเอกสารการเงิน</h1><div class="sub">กรอกเลขใบเสร็จ/ใบกำกับภาษี หรือ Verification Code แล้วแสดงผลในหน้าเดียวกัน</div></div></div><div class="panel"><div class="verifybar"><div class="field"><label>เลขเอกสาร / Verification Code</label><input id="code" placeholder="เช่น RCPT-690711 หรือ VR-RCPT-690711"></div><button class="btn btn-p" onclick="verify()">ตรวจสอบ</button></div><div id="result" class="verify-result"></div></div></div></main></div><script>window.ACTIVE_LEAF='ตรวจสอบเอกสารการเงิน';</script><script src="../shared/rus-nav.js"></script><script src="../shared/system4-partial-payment-demo.js"></script><script>
const m=S4PartialDemo.money;function verify(){const c=code.value.trim();if(!c){result.innerHTML='<div class="warnbox">กรุณาระบุเลขเอกสารหรือ Verification Code</div>';return}const r=S4PartialDemo.findAnyReceipt(c);if(!r){result.innerHTML='<div class="dangerbox"><b>ไม่พบเอกสาร</b><br>กรุณาตรวจสอบเลขเอกสารหรือรหัสอีกครั้ง</div>';return}if(r.status==='cancelled'){result.innerHTML=`<div class="dangerbox"><b>เอกสารนี้ถูกยกเลิกแล้ว</b><br>${r.id} · ${m(r.amount)} บาท<br>เหตุผล: ${r.cancelReason||'-'}</div>`;return}result.innerHTML=`<div class="paid-banner"><b>เอกสารถูกต้องและใช้งานได้</b></div><div class="panel" style="margin-top:12px"><div class="kv"><b>เลขเอกสาร</b><span>${r.id}</span><b>ประเภท</b><span>${r.type==='tax'?'ใบกำกับภาษี':'e-Receipt'}</span><b>Invoice</b><span>${r.invoiceId}</span><b>Payment</b><span>${r.paymentId}</span><b>ผู้ชำระ</b><span>${r.payerId} · ${r.payerName}</span><b>ยอดรับจริง</b><span class="money">${m(r.amount)} บาท</span><b>สถานะ</b><span class="status ok">Active</span></div><div class="footeractions"><button class="btn btn-p" onclick="location.href='5050_receipt.html?id=${r.id}${S4PartialDemo.sampleReceipt(r.id)?'&sample=1':''}'">ดูเอกสาร</button></div></div>`}code.addEventListener('keydown',e=>{if(e.key==='Enter')verify()});const auto=new URLSearchParams(location.search).get('code');if(auto){code.value=auto;verify()}
</script></body></html>
