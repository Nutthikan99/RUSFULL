<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>e-Receipt — SYSTEM 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../shared/rus-ui.css"><link rel="stylesheet" href="../shared/rus-ui-normalize.css"><link rel="stylesheet" href="../shared/rus-sidebar-shared.css"><link rel="stylesheet" href="../shared/system4-v144.css"><style>.paper{max-width:820px;margin:20px auto;background:white;border:1px solid #dbe3ee;border-radius:12px;padding:34px;box-shadow:0 8px 24px #0f172a14}.paperhead{display:flex;justify-content:space-between;border-bottom:2px solid #1d4f91;padding-bottom:18px;margin-bottom:22px}.big{font-size:24px;font-weight:600;color:#173b6d}.amountbox{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:16px;text-align:right;font-size:22px;font-weight:600}@media print{.topbar,.sidebar,.backdrop,.screen-actions,.breadcrumb{display:none!important}.content{margin:0!important;padding:0!important}.paper{box-shadow:none;border:0;margin:0;max-width:none}}</style></head><body><div class="app"><header class="topbar"><button aria-label="ย่อ/ขยายเมนู" class="menu-toggle" id="menuToggle"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><div class="brand"><div class="mark">RUS</div><div class="titles"><div class="th">ระบบการเงินและค่าธรรมเนียม</div><div class="en">Student Finance System · มทร.สุวรรณภูมิ</div></div></div><div class="spacer"></div><div class="util"><button class="user-chip"><div class="who"><div class="n">เจ้าหน้าที่การเงิน</div><div class="r">Finance Staff · SYSTEM 4</div></div><div class="avatar">กง</div></button><a class="logout-btn" href="../logout.html"><span>ออกจากระบบ</span></a></div></header><aside class="sidebar" id="sidebar"><div class="nav-section"><div class="label">ภาพรวม</div><a class="nav-parent" href="../main.html"><span class="ico">▦</span><span class="txt">แดชบอร์ด</span></a></div><div class="nav-section"><div class="label">ระบบงาน (9 ระบบ)</div><div id="navSystems"></div></div></aside><div class="backdrop" id="backdrop"></div><main class="content"><div class="s4-page"><div class="breadcrumb">หน้าแรก &gt; STEP 5 &gt; เอกสารการเงิน</div><div class="screen-actions" style="max-width:820px;margin:12px auto;display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-s" onclick="history.back()">กลับ</button><button class="btn btn-p" onclick="window.print()">พิมพ์ / Save PDF</button></div><div id="paper" class="paper"></div></div></main></div><script>window.ACTIVE_LEAF='ใบเสร็จและเอกสารการเงิน';</script><script src="../shared/rus-nav.js"></script><script src="../shared/system4-partial-payment-demo.js"></script><script>
const qs=new URLSearchParams(location.search),id=qs.get('id'),isSample=qs.get('sample')==='1',r=isSample?S4PartialDemo.sampleReceipt(id):S4PartialDemo.findReceipt(id),m=S4PartialDemo.money,s=S4PartialDemo.load();if(!r){paper.innerHTML='<div class="dangerbox">ไม่พบเอกสาร</div>'}else{const p=isSample?S4PartialDemo.samplePayment(r.paymentId):S4PartialDemo.findPayment(r.paymentId),dt=new Date(r.issuedAt).toLocaleString('th-TH');paper.innerHTML=`<div class="paperhead"><div><div class="big">มหาวิทยาลัยเทคโนโลยีราชมงคลสุวรรณภูมิ</div><div>${r.type==='tax'?'ใบกำกับภาษี':'ใบเสร็จรับเงินอิเล็กทรอนิกส์ (e-Receipt)'}</div></div><div style="text-align:right"><b>${r.id}</b><br><span class="muted">วันที่ออก ${dt}</span></div></div><div class="split2"><div><h3>ผู้ชำระ</h3><div class="kv"><b>รหัส</b><span>${r.payerId}</span><b>ชื่อ</b><span>${r.payerName}</span></div></div><div><h3>อ้างอิง</h3><div class="kv"><b>Invoice</b><span>${r.invoiceId}</span><b>Payment</b><span>${r.paymentId}</span><b>ช่องทาง</b><span>${p?.channel||'-'}</span></div></div></div><div style="margin-top:24px"><table><thead><tr><th>รายการ</th><th style="text-align:right">จำนวนเงิน</th></tr></thead><tbody><tr><td>รับชำระตาม ${r.invoiceId} / ${r.paymentId}</td><td style="text-align:right">${m(r.amount)} บาท</td></tr></tbody></table></div><div class="amountbox">รวมรับชำระ ${m(r.amount)} บาท</div><div class="note" style="margin-top:20px"><b>Verification Code:</b> ${r.verification}<br>ตรวจสอบความถูกต้องได้ที่ STEP 5 → ตรวจสอบเอกสารการเงิน</div>${r.status==='cancelled'?'<div class="dangerbox" style="margin-top:18px"><b>เอกสารนี้ถูกยกเลิก</b><br>'+ (r.cancelReason||'') +'</div>':''}`}
</script></body></html>
